services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${POSTGRES_DB:-prefect}
    volumes:
      - prefect-db-data:/var/lib/postgresql/data
    restart: always

  server:
    image: prefecthq/prefect:3-python3.11
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-prefect}:${POSTGRES_PASSWORD:-prefect}@database:5432/${POSTGRES_DB:-prefect}
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_UI_API_URL: https://prefect.oliverq.io/api
      PREFECT_SERVER_API_CORS_ALLOWED_ORIGINS: "https://prefect.oliverq.io"
      PREFECT_SERVER_CSRF_TOLERATED_ORIGINS: "https://prefect.oliverq.io"
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_AUTH_STRING:-admin:prefect}
    ports:
      - "4200:4200"
    depends_on:
      - database
    restart: always

volumes:
  prefect-db-data:
